name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints/ci.txt
      - run: python -m pip install -c constraints/ci.txt -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: noema lint .
      - run: noema audit . --section context
