name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_CONSTRAINT: constraints/ci.txt

jobs:
  test:
    if: ${{ !(github.event_name == 'pull_request' && (github.head_ref == 'codex/noema-vnext-execution-governance' || github.head_ref == 'codex/noema-vnext-final-closure')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            constraints/ci.txt
            pyproject.toml
      - run: python -m pip install -c constraints/ci.txt -e ".[dev]"
      - name: R5 T1 exact-SHA gate
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/codex/noema-vnext-execution-governance' || github.ref == 'refs/heads/codex/noema-vnext-final-closure') }}
        env:
          NOEMA_EXPECTED_SHA: ${{ github.sha }}
          NOEMA_T1_OUTPUT: ${{ runner.temp }}/noema-t1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python .github/scripts/verify_t1.py --root . --expected-sha "$NOEMA_EXPECTED_SHA" --output-dir "$NOEMA_T1_OUTPUT"
      - name: Upload T1 evidence
        if: ${{ always() && github.event_name == 'push' && (github.ref == 'refs/heads/codex/noema-vnext-execution-governance' || github.ref == 'refs/heads/codex/noema-vnext-final-closure') }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: noema-t1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/noema-t1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/CANARY_RESULTS.json
            ${{ runner.temp }}/noema-t1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/DOGFOOD_REPORT.md
            ${{ runner.temp }}/noema-t1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/TEST_SUMMARY.json
            ${{ runner.temp }}/noema-t1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/VERIFICATION.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false
      - if: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/codex/noema-vnext-execution-governance' || github.ref == 'refs/heads/codex/noema-vnext-final-closure')) }}
        run: ruff check .
      - if: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/codex/noema-vnext-execution-governance' || github.ref == 'refs/heads/codex/noema-vnext-final-closure')) }}
        run: pytest
      - if: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/codex/noema-vnext-execution-governance' || github.ref == 'refs/heads/codex/noema-vnext-final-closure')) }}
        run: noema lint .
      - if: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/codex/noema-vnext-execution-governance' || github.ref == 'refs/heads/codex/noema-vnext-final-closure')) }}
        run: noema audit . --section context
