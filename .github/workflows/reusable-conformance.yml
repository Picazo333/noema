name: Noema Conformance

on:
  workflow_call:
    inputs:
      project_root:
        type: string
        default: "."
        required: false

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Noema
        uses: actions/checkout@v4
        with:
          repository: Picazo333/noema
          ref: 769a84efa0c1489d24a2b6f9879697d8ecae166a
          path: .noema-tool
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .noema-tool/pyproject.toml
      - run: python -m pip install -e ./.noema-tool
      - run: noema lint "${{ inputs.project_root }}"
