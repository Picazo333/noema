name: Noema Conformance

on:
  workflow_call:
    inputs:
      project_root:
        type: string
        default: "."
        required: false

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Checkout pinned Noema
        uses: actions/checkout@v6
        with:
          repository: Picazo333/noema
          ref: 5b282ae358bc300fbc385c41050566bbe30cf6e3
          path: .noema-tool
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .noema-tool/constraints/ci.txt
      - name: Install pinned Noema toolchain
        env:
          PIP_CONSTRAINT: .noema-tool/constraints/ci.txt
        run: python -m pip install -c .noema-tool/constraints/ci.txt -e ./.noema-tool
      - run: noema lint "${{ inputs.project_root }}"
