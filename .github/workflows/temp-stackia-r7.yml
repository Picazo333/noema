name: Temp StackIA R7 Human QA

on:
  push:
    branches:
      - "temp/stackia-r6-writeback-20260921"

jobs:
  human-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install harnesses
        run: |
          cd tmp/stackia-r6-repo
          python -m pip install -r requirements-dev.txt >/dev/null
          mkdir -p /tmp/r7
          cd /tmp/r7
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 >/dev/null 2>&1
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Start validated local UI
        run: |
          cd tmp/stackia-r6-repo
          PYTHONPATH=scripts python scripts/serve_human_ui_v2.py --no-open --port 8765 >/tmp/r7-server.log 2>&1 &
          echo $! >/tmp/r7-server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/status >/tmp/r7-status.json; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/r7-server.log
          exit 1

      - name: Run R7 human task, keyboard, mobile and density QA
        run: |
          cat > /tmp/r7/audit.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';

          const browser=await puppeteer.launch({
            executablePath:process.env.CHROME_BIN,
            headless:true,
            args:['--no-sandbox','--disable-dev-shm-usage']
          });
          const page=await browser.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          const txt=sel=>page.$eval(sel,e=>e.textContent.trim());
          const count=sel=>page.$$(sel).then(x=>x.length);
          const go=async id=>{
            await page.click('.nav button[data-page="'+id+'"]');
            await page.waitForFunction(x=>document.querySelector('#page-'+x)?.classList.contains('active'),{},id);
          };
          const search=async value=>{
            await page.$eval('#invSearch',(el,v)=>{el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}))},value);
          };
          const applyCurrent=async()=>{
            await page.waitForSelector('#r6Apply',{timeout:15000});
            const respP=page.waitForResponse(r=>r.url().endsWith('/api/apply'),{timeout:30000});
            const navP=page.waitForNavigation({waitUntil:'networkidle0',timeout:30000}).catch(()=>null);
            await page.click('#r6Apply');
            const resp=await respP, body=await resp.json();
            assert(body.status==='APPLIED','apply failed '+JSON.stringify(body));
            await navP;
            await page.waitForFunction(()=>document.querySelector('#writebackStatus')?.textContent.trim()==='Edición activa',{timeout:30000});
          };
          const luminance=(rgb)=>{
            const m=rgb.match(/\d+(?:\.\d+)?/g); if(!m)return null;
            const vals=m.slice(0,3).map(Number).map(v=>v/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));
            return .2126*vals[0]+.7152*vals[1]+.0722*vals[2];
          };
          const contrast=(a,b)=>{const x=luminance(a),y=luminance(b);const hi=Math.max(x,y),lo=Math.min(x,y);return (hi+.05)/(lo+.05)};
          const nearestBg=el=>{
            let n=el;
            while(n){
              const bg=getComputedStyle(n).backgroundColor;
              if(bg && !bg.endsWith(', 0)') && bg!=='rgba(0, 0, 0, 0)' && bg!=='transparent')return bg;
              n=n.parentElement;
            }
            return getComputedStyle(document.body).backgroundColor;
          };

          await page.setViewport({width:1440,height:1000,deviceScaleFactor:1});
          await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle0'});
          assert((await txt('#writebackStatus'))==='Edición activa','operator edit label');

          // Exact IA.
          const nav=await page.$$eval('.nav button[data-page]',e=>e.map(x=>x.textContent.trim()));
          assert(JSON.stringify(nav)===JSON.stringify(['Hoy','Inventario','Presupuesto','Benchmark']),'primary IA drift');
          assert(await count('.sidebar')===0,'sidebar returned');

          // H2 + H8: immediate money + bounded attention.
          assert((await txt('.money-primary strong'))==='MX$1,665','H2 reference spend');
          assert((await txt('.money-side strong'))==='MX$0','H2 confirmed spend');
          const attention=await count('#hoyAttention .simple-row');
          assert(attention>0 && attention<=7,'H8 attention density');
          const hoyVisible=await txt('#page-hoy');
          assert(!/\bUNKNOWN\b|\bUNVERIFIED\b|\bNOT_TRIED\b|\bNOT_DEPLOYED\b/.test(hoyVisible),'raw ontology leaked on Hoy');
          assert(!hoyVisible.includes('183')&&!hoyVisible.includes('90'),'implementation cardinality leaked on Hoy');

          // Keyboard: skip link, focus visibility, Enter navigation.
          await page.keyboard.press('Tab');
          assert(await page.$eval(':focus',e=>e.classList.contains('skip-link')),'skip link is not first keyboard target');
          const outline=await page.$eval(':focus',e=>({style:getComputedStyle(e).outlineStyle,width:getComputedStyle(e).outlineWidth}));
          assert(outline.style!=='none'&&outline.width!=='0px','focus not visible');
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>document.activeElement?.id==='main-content');
          assert(await page.$eval(':focus',e=>e.id)==='main-content','skip link did not focus main');

          // H1: current stack can be resolved through Inventario -> En uso without diagnostics.
          await go('inventario');
          await page.select('#invStatus','En uso');
          const usedText=await txt('#inventoryBody');
          assert(usedText.includes('ChatGPT')&&usedText.includes('Cursor')&&usedText.includes('Gemini'),'H1 active/core tools not discoverable');
          assert(!/\bUNKNOWN\b|\bUNVERIFIED\b|\bNOT_TRIED\b/.test(usedText),'raw enums in H1 path');
          await page.select('#invStatus','');

          // H3: named-tool search returns human-readable state.
          const t0=Date.now();
          await search('n8n');
          const n8nText=await txt('#inventoryBody');
          const machineLookupMs=Date.now()-t0;
          assert(n8nText.includes('n8n'),'H3 n8n missing');
          assert(n8nText.includes('Sin registrar'),'H3 state not human-readable');
          assert(!n8nText.includes('UNKNOWN'),'H3 raw enum leaked');

          // Drawer keyboard opening and focus trap.
          const n8nManage=await page.$('#inventoryBody [data-inspect="n8n"]');
          await n8nManage.focus();
          await page.keyboard.press('Enter');
          await page.waitForFunction(()=>document.querySelector('#drawer')?.classList.contains('open'));
          assert(await page.$eval(':focus',e=>e.id)==='drawerClose','drawer initial focus');
          await page.keyboard.down('Shift'); await page.keyboard.press('Tab'); await page.keyboard.up('Shift');
          assert(await page.$eval('#drawer',d=>d.contains(document.activeElement)),'Shift+Tab escaped modal');
          // Move to last visible focusable then Tab; focus must remain in drawer.
          await page.$eval('#drawer',d=>{
            const els=[...d.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],summary,[tabindex]:not([tabindex="-1"])')].filter(e=>e.offsetParent!==null);
            els[els.length-1]?.focus();
          });
          await page.keyboard.press('Tab');
          assert(await page.$eval('#drawer',d=>d.contains(document.activeElement)),'Tab escaped modal');

          // H4: after find -> Manage already done (1), Ya la uso (2), Apply (3).
          const usageButtons=await page.$$('#drawerBody [data-command="SET_USAGE"]');
          assert(usageButtons.length===2,'H4 usage buttons');
          await usageButtons[0].click();
          await page.waitForSelector('#r6Apply');
          assert((await txt('.command-feedback')).includes('PREVIEW VALIDADO'),'H4 validated preview');
          await applyCurrent();
          await go('inventario'); await search('n8n');
          assert((await txt('#inventoryBody')).includes('En uso'),'H4 usage did not persist');

          // Error recovery: invalid USED -> NOT_TRIED is explained, not applied.
          const manage2=await page.$('#inventoryBody [data-inspect="n8n"]'); await manage2.click(); await page.waitForFunction(()=>document.querySelector('#drawer')?.classList.contains('open')); await new Promise(r=>setTimeout(r,250));
          const usage2=await page.$$('#drawerBody [data-command="SET_USAGE"]');
          await usage2[1].click();
          await page.waitForFunction(()=>document.querySelector('.command-feedback')?.textContent.includes('Cambio bloqueado'));
          const blockedText=await txt('.command-feedback');
          assert(blockedText.includes('Cambio bloqueado'),'blocked feedback missing');
          assert(!blockedText.includes('Traceback'),'technical error leaked');
          await page.keyboard.press('Escape');

          // H5: TEST -> PARK in <=3 interactions after finding v0.
          await search('v0');
          const v0Manage=await page.$('#inventoryBody [data-inspect="v0"]');assert(!!v0Manage,'v0 missing');
          await v0Manage.click(); await page.waitForFunction(()=>document.querySelector('#drawer')?.classList.contains('open')); await new Promise(r=>setTimeout(r,250)); // 1
          const pause=await page.$x?.catch?.(()=>null);
          const decisionBtns=await page.$$('#drawerBody [data-command="SET_DECISION"]');
          const labels=await Promise.all(decisionBtns.map(b=>b.evaluate(e=>e.textContent.trim())));
          const idx=labels.indexOf('Poner en pausa');assert(idx>=0,'pause action missing');
          await decisionBtns[idx].click(); // 2
          await page.waitForSelector('#r6Apply');
          await applyCurrent(); // 3
          await go('inventario');await search('v0');
          assert((await txt('#inventoryBody')).includes('En pausa'),'H5 decision did not persist');

          // H6: deployment is host-specific and verification remains unchanged.
          await page.click('#classSeg button[data-class="Skills"]');await search('superpowers');
          const sm=await page.$('#inventoryBody [data-inspect="superpowers"]');assert(!!sm,'superpowers missing');await sm.click();await page.waitForFunction(()=>document.querySelector('#drawer')?.classList.contains('open'));await new Promise(r=>setTimeout(r,250));
          const beforeVerify=await page.$eval('#drawerBody .detail-cell:nth-child(2) strong',e=>e.textContent.trim());
          const depBtn=await page.$('#drawerBody [data-command="SET_DEPLOYMENT"]');assert(!!depBtn,'H6 deployment entry missing');await depBtn.click();
          await page.waitForSelector('#r6Host');
          await page.select('#r6Host','chatgpt');await page.select('#r6DepState','CONFIGURED');
          await page.click('#r6DepPreview');await page.waitForSelector('#r6Apply');await applyCurrent();
          await go('inventario');await page.click('#classSeg button[data-class="Skills"]');await search('superpowers');
          await (await page.$('#inventoryBody [data-inspect="superpowers"]')).click();await page.waitForFunction(()=>document.querySelector('#drawer')?.classList.contains('open'));await new Promise(r=>setTimeout(r,250));
          const afterVerify=await page.$eval('#drawerBody .detail-cell:nth-child(2) strong',e=>e.textContent.trim());
          assert(beforeVerify===afterVerify,'H6 deployment altered verification');
          assert((await txt('#drawerBody')).includes('ChatGPT: Configurado'),'H6 host deployment not visible/humanized');
          await page.keyboard.press('Escape');

          // H7: representative test records TESTED, not VERIFIED; no free VERIFIED action.
          await page.click('#classSeg button[data-class="Tools"]');await search('v0');
          await (await page.$('#inventoryBody [data-inspect="v0"]')).click();await page.waitForFunction(()=>document.querySelector('#drawer')?.classList.contains('open'));await new Promise(r=>setTimeout(r,250));
          assert(!(await txt('#drawerBody')).includes('Mark VERIFIED'),'generic VERIFIED action');
          const testBtn=await page.$('#drawerBody [data-command="RECORD_TEST"]');assert(!!testBtn,'H7 test entry missing');await testBtn.click();
          await page.waitForSelector('#r6Workload');
          await page.select('#r6Workload','agency-web-v0-frontend-acceleration-v1');
          await page.type('#r6Summary','R7 disposable representative evidence.');
          await page.click('#r6TestPreview');await page.waitForSelector('#r6Apply');await applyCurrent();
          await go('inventario');await page.click('#classSeg button[data-class="Tools"]');await search('v0');
          const v0After=await txt('#inventoryBody');
          assert(v0After.includes('Probado'),'H7 did not reach TESTED');
          assert(!v0After.includes('Verificado'),'H7 auto-promoted VERIFIED');

          // Class separation + pathological density.
          await page.click('#classSeg button[data-class="Todo"]');await search('');
          assert(await count('#inventoryBody tr')===183,'full registry coverage');
          const mixed=await txt('#inventoryBody');
          assert(mixed.includes('Tools')&&mixed.includes('Skills')&&mixed.includes('MCPs')&&mixed.includes('Plugins'),'mixed view lost class identity');
          const density=await page.evaluate(()=>({body:document.body.scrollWidth,inner:innerWidth,rows:document.querySelectorAll('#inventoryBody tr').length,cols:document.querySelectorAll('#page-inventario thead th').length}));
          assert(density.body<=density.inner+1,'pathological desktop overflow');
          assert(density.cols===5,'inventory density >5 columns');

          // Contrast: key normal-size text colors must meet 4.5; large money alert must meet 3.
          const contrastCases=await page.evaluate(()=>{
            const lum=rgb=>{const m=rgb.match(/\d+(?:\.\d+)?/g);const v=m.slice(0,3).map(Number).map(x=>x/255).map(x=>x<=.04045?x/12.92:Math.pow((x+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2]};
            const ratio=(a,b)=>{const A=lum(a),B=lum(b),hi=Math.max(A,B),lo=Math.min(A,B);return (hi+.05)/(lo+.05)};
            const bg=el=>{let n=el;while(n){const v=getComputedStyle(n).backgroundColor;if(v!=='rgba(0, 0, 0, 0)'&&v!=='transparent')return v;n=n.parentElement}return getComputedStyle(document.body).backgroundColor};
            const sels=['.lede','.eyebrow','#inventoryCount','.item-name small','.tag','.nav button[aria-current="page"]'];
            return sels.map(s=>{const e=document.querySelector(s);const cs=getComputedStyle(e);return {selector:s,ratio:ratio(cs.color,bg(e)),fontSize:parseFloat(cs.fontSize),fontWeight:parseInt(cs.fontWeight)||400}});
          });
          for(const c of contrastCases)assert(c.ratio>=4.5,'contrast fail '+JSON.stringify(c));

          // Mobile.
          await page.setViewport({width:390,height:844,deviceScaleFactor:1});
          await go('hoy');
          const mobile=await page.evaluate(()=>({inner:innerWidth,body:document.body.scrollWidth,nav:document.querySelectorAll('.nav button[data-page]').length,attention:document.querySelectorAll('#hoyAttention .simple-row').length}));
          assert(mobile.body<=mobile.inner+1,'mobile body overflow');
          assert(mobile.nav===4,'mobile primary nav drift');
          assert(mobile.attention<=7,'mobile attention density');

          // Direct-file/read-only candidate must still have no secret/external dependency.
          assert(errors.length===0,'page errors: '+errors.join(' | '));
          console.log(JSON.stringify({
            status:'PASS',
            human_tasks:{
              H1:'PASS structural path',
              H2:'PASS',
              H3:'PASS',
              H4:'PASS <=3 interactions after find',
              H5:'PASS <=3 interactions after find',
              H6:'PASS',
              H7:'PASS',
              H8:'PASS',
              H9:'PASS machine proxy',
              H10:'PASS machine proxy'
            },
            machine_named_tool_lookup_ms:machineLookupMs,
            attention_items:attention,
            density,
            contrast:contrastCases,
            mobile,
            page_errors:errors
          },null,2));
          await browser.close();
          NODE
          set +e
          CHROME_BIN="$CHROME_BIN" node /tmp/r7/audit.mjs
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then cat /tmp/r7-server.log; fi
          exit "$rc"

      - name: Canonical safety after destructive disposable QA
        run: |
          cd tmp/stackia-r6-repo
          python - <<'PY'
          import json
          from pathlib import Path
          snap=json.loads(Path("ui/derived/snapshots/2026-10.actual.json").read_text())
          assert len(snap["registry"]["items"])==183
          assert len(snap["budget"]["paid_plans"])==6
          assert snap["overview"]["spend"]["reference_mxn"]==1665
          assert snap["overview"]["spend"]["paid_confirmed_mxn"]==0
          assert not Path("ui/prototypes/human-v2-r6-writeback.html").read_text().count("github_pat_")
          print(json.dumps({"status":"PASS","registry":183,"paid_rows":6,"reference_mxn":1665,"paid_confirmed_mxn":0},indent=2))
          PY
