harvest_id: harvest-20260921-contract-id-namespace-integrity
project_id: noema
finding: >-
  Governed workflows should keep contract IDs, generated-artifact IDs, style/reference IDs,
  experiment IDs and human-facing aliases in distinct namespaces. A label collision can
  make a durable state cursor falsely report completion even when the underlying contract
  was never satisfied.
