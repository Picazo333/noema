# W07 — Protocol Portability, CI & Artifact Promotion
# Compiled by Divinivid Genesis (2026-10-02). Program contract revision 1.
# Schema: noema work-order v1 (github://Picazo333/noema/schemas/work-order/v1.schema.json@1047d10). Program
# coordination fields (state, dependencies, refs, next action) live in CHECKPOINT.yaml.
work_order_id: divinivid-w07-protocol-portability
project_id: noema
objective: 'Make operating quality survive executor/account/session changes: clean account + zero chat history +
  repository authority + WorkOrder = correct operation. Specify the minimum durable entry path, keep provider adapters
  thin, build a clean-session evaluation, formalize Artifact Promotion with durable receipts (GitHub / Obsidian
  / Drive) and provide deterministic CI checks.'
scope:
  allowed:
  - Specify the durable entry path (AGENTS.md → noema.project.yaml → exact WorkOrder → contracts → checkpoint) in
    noema spec.
  - Define thin-adapter rules for CLAUDE/Cursor/Codex files (pointer only).
  - Build a clean-session evaluation (protocol + scoring) and prepare one real bounded clean-session workload suitable
    to evaluate Sonnet 5.5.
  - Define ARTIFACT_PROMOTION_PROTOCOL and promotion-receipt schema (GitHub = executable/canonical, Obsidian = durable
    knowledge, Drive = media/heavy/shared).
  - Provide reusable CI checks (schemas, required artifacts, contract versions, broken refs, manifest completeness,
    receipts, generated-artifact freshness, WorkOrder conformance, no-regression) usable by other repos.
  excluded:
  - Universal bidirectional sync.
  - Claiming Drive/Obsidian verification CI cannot observe.
  - Duplicating program authority into provider-specific files.
  - Adopting the checks in other repos directly (each repo's own PR/WO adopts them).
