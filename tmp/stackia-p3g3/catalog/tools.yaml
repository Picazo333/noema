schema: stackia/tools@0.2
status: canonical
identity_rules:
  plans_are_tools: false
  capabilities_are_peer_tools_by_default: false
  surfaces_are_peer_tools_by_default: false
  identity_test:
    - distinct_capability_boundary
    - distinct_configuration_or_state
    - distinct_verification_workload
    - distinct_runtime_or_release_lifecycle
functional_categories:
  - CORE_AI
  - CODING_AGENT
  - AGENTIC_ENVIRONMENT
  - RESEARCH_KNOWLEDGE
  - MEMORY_CONTEXT
  - DEVELOPER_QA
  - DESIGN_VISUAL
  - MEDIA_FACTORY
  - AUTOMATION_ORCHESTRATION
  - INFRA_BACKEND
  - LOCAL_INFERENCE
  - SECURITY_UTILITY
  - LEARNING
  - DEV_UTILITY

