    allowed: [CONFIRMED, REFERENCE_ESTIMATE, UNKNOWN]
  subscription_state:
    allowed: [ACTIVE, FREE, PREPAID, PENDING_ACTIVATION, WILL_NOT_RENEW, INACTIVE]
  billing_period:
    allowed: [MONTHLY, ANNUAL, PREPAID, FREE, UNKNOWN]
  rule: "Budget views count each paid plan once; included tools/capabilities are expanded elsewhere without duplicate spend."

