schema: stackia/evaluations@0.2
status: canonical

semantics:
  absent_entry: "No durable evaluation has been recorded yet. Do not infer NOT_TRIED, DROP or NOT_DEPLOYED from absence."
  usage:
    allowed: [UNKNOWN, NOT_TRIED, USED]
    meaning: "Whether the user has actually used the subject."
  verification:
    allowed: [UNVERIFIED, TESTED, VERIFIED]
    meaning: "Evidence quality for a defined real workload. Deployment never upgrades this axis automatically."
  decision:
    allowed: [KEEP, TEST, PARK, DROP]
    meaning: "Current StackIA disposition."
  priority:
    allowed: [CORE, NOW, NEXT, LATER, TRIGGER]
    meaning: "Current action priority. May be omitted when not meaningful, for example DROP."
  evidence:
    rule: "USED, TESTED and VERIFIED should carry durable evidence or an explicit audit source. VERIFIED requires workload evidence."

